<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stick Shooter - Windows XP Edition</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #FFFFFF;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #sketch-container {
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <div id="sketch-container"></div>
    <!-- Load sketch.js FIRST - must complete before p5.js loads -->
    <script>
      // Load sketch.js synchronously
      const sketchScript = document.createElement('script');
      sketchScript.src = 'sketch.js';
      sketchScript.onload = function() {
        // Sketch loaded, now load p5.js
        const p5Script = document.createElement('script');
        p5Script.src = 'https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js';
        document.body.appendChild(p5Script);
      };
      document.body.appendChild(sketchScript);
    </script>
</body>
</html>
